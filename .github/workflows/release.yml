name: Release

# Two paths, both using PyPI trusted publishing (OIDC), so no API token is ever
# stored in this repository:
#
#   * Run this workflow manually ("Run workflow" / `gh workflow run release.yml`)
#     to publish to TestPyPI. Use this to rehearse a release.
#   * Push a `v*` tag to publish to the real PyPI.
#
# One-time setup, per index: add a pending publisher at
# https://pypi.org/manage/account/publishing/ (and the same on test.pypi.org)
# with project `myrssfeed`, owner `fabianhogger`, repository `myrssfeed`,
# workflow `release.yml`, and environment `pypi` (`testpypi` on TestPyPI).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: python -m pip install --upgrade pip build twine && python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      - name: Verify the tag matches the package version
        # A mismatch means the version bump was forgotten, which would publish a
        # release under the wrong number. PyPI never lets a number be reused, so
        # this has to fail before the upload, not after.
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import re, pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('src/myrssfeed/__init__.py').read_text()).group(1))")
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match __version__ $version"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  testpypi:
    name: publish to TestPyPI
    # Manual runs only: a tag release must not be rehearsed, it must ship.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: publish to PyPI
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
