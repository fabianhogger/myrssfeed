name: Release

# Publishes to PyPI when a v* tag is pushed. Uses trusted publishing (OIDC), so
# no API token needs to be stored in the repository; configure a pending
# publisher on PyPI for this repo, this workflow file, and the `pypi`
# environment before the first release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: python -m pip install --upgrade pip build twine && python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      - name: Verify the tag matches the package version
        # A mismatch here means the version bump was forgotten, and PyPI would
        # reject or mislabel the upload.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('src/myfeed/__init__.py').read_text()).group(1))")
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match __version__ $version" >&2
            exit 1
          fi
        if: github.event_name == 'push'

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
