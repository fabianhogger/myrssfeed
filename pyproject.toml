[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "myfeed"
dynamic = ["version"]
description = "Read RSS feeds and keep only the news that matches your criteria, judged by Claude."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "the myfeed authors" }]
keywords = ["rss", "atom", "feeds", "news", "claude", "anthropic", "llm", "filter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Text Processing :: Filters",
    "Typing :: Typed",
]
dependencies = [
    # 0.125 is the oldest release carrying output_config and server-side
    # fallbacks; 1.x is picked up automatically on Python 3.10+, where it is
    # published. Only messages.create is used, which both majors provide.
    "anthropic>=0.125.0",
    "feedparser>=6.0.0",
    # tomllib joined the standard library in 3.11.
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
myfeed = "myfeed.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/myfeed"
Issues = "https://github.com/your-org/myfeed/issues"
Source = "https://github.com/your-org/myfeed"
Changelog = "https://github.com/your-org/myfeed/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/myfeed/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/myfeed"]

[tool.hatch.build.targets.sdist]
include = ["src/myfeed", "tests", "README.md", "LICENSE", "CHANGELOG.md", "examples"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["src"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 96
src = ["src", "tests"]
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF",
]
ignore = [
    # The package supports Python 3.9, so PEP 585/604 annotation styles that
    # only evaluate lazily are avoided in favour of typing.List / Optional[...].
    "UP006",
    "UP007",
    "UP035",
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "RUF005"]

[tool.mypy]
python_version = "3.9"
files = ["src/myfeed"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["feedparser.*", "tomli.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["myfeed"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
